name = "blog-c4605"
main = ".shadow-cljs/worker-out/worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[routes]]
pattern = "blog.c4605.com"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = [
  "/*",
  "!/assets/*",
  "!/*.js",
  "!/*.css",
  "!/*.map",
  "!/*.ico",
  "!/*.png",
  "!/*.svg",
  "!/robots.txt",
  "!/CNAME",
]
